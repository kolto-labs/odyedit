[package]
name = "odyedit"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Editor for the changes.ini files that drive KotOR mod installers"
license = "MIT"
readme = "README.md"
keywords = ["kotor", "modding", "tslpatcher", "ini", "editor"]
categories = ["game-development", "gui"]

[lib]
name = "odyedit"
path = "src/lib.rs"

[[bin]]
name = "odyedit"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

[dependencies]
# Path dep while the trees sit side by side. Release builds pin a git tag:
# kotor-formats = { git = "https://github.com/arrenkaetris/kotor-formats", tag = "v0.1.0" }
kotor-formats = { path = "../kotor-formats/crates/kotor-formats" }

eframe = { version = "0.32", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.32", optional = true }
egui_extras = { version = "0.32", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
