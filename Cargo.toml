[package]
name = "odyedit"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Editor for the changes.ini files that drive KotOR mod installers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arrenkaetris/odyedit"
keywords = ["kotor", "modding", "tslpatcher", "ini", "editor"]
categories = ["game-development", "gui"]

[lib]
name = "odyedit"
path = "src/lib.rs"

[[bin]]
name = "odyedit"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

[dependencies]
# Pinned to a commit rather than a tag: kotor-diff-v0.2.1 does not resolve,
# because kotor-diff still asked there for kotor-formats ^0.1.0 after
# kotor-formats had gone to 0.2.0. Fixed on main, but the fix is in the root
# manifest, which sits outside every release package, so no tag carries it yet.
# Move to the next tag once one does.
#
# One ref for both either way: cargo resolves a git source once, so every
# dependency taken from a repository has to name the same one.
kotor-formats = { git = "https://github.com/arrenkaetris/kotor-formats", rev = "7ab00ee2a508923411912f92bda4141bc0551e1d" }
kotor-diff = { git = "https://github.com/arrenkaetris/kotor-formats", rev = "7ab00ee2a508923411912f92bda4141bc0551e1d" }

# To work against a local kotor-formats checkout instead, uncomment:
# [patch."https://github.com/arrenkaetris/kotor-formats"]
# kotor-formats = { path = "../kotor-formats/crates/kotor-formats" }
# kotor-diff = { path = "../kotor-formats/crates/kotor-diff" }

eframe = { version = "0.32", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.32", optional = true }
egui_extras = { version = "0.32", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
