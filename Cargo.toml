[package]
name = "odyedit"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Editor for the changes.ini files that drive KotOR mod installers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arrenkaetris/odyedit"
keywords = ["kotor", "modding", "tslpatcher", "ini", "editor"]
categories = ["game-development", "gui"]

[lib]
name = "odyedit"
path = "src/lib.rs"

[[bin]]
name = "odyedit"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd"]

[dependencies]
# Pinned to the commit that adds kotor-diff, because no tag carries that crate
# yet. A commit does not move, so a fresh clone of this repo alone builds; swap
# both for a tag once arrenkaetris/kotor-formats#1 is merged and released.
kotor-formats = { git = "https://github.com/arrenkaetris/kotor-formats", rev = "999a0b52b5867ab41b2cbb8c1b1a40bcaf695cb0" }
kotor-diff = { git = "https://github.com/arrenkaetris/kotor-formats", rev = "999a0b52b5867ab41b2cbb8c1b1a40bcaf695cb0" }

# To work against a local kotor-formats checkout instead, uncomment:
# [patch."https://github.com/arrenkaetris/kotor-formats"]
# kotor-formats = { path = "../kotor-formats/crates/kotor-formats" }
# kotor-diff = { path = "../kotor-formats/crates/kotor-diff" }

eframe = { version = "0.32", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = { version = "0.32", optional = true }
egui_extras = { version = "0.32", optional = true }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
